<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Fácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container d-flex align-items-center justify-content-center min-vh-100 p-4">
        <div class="card p-5" style="max-width: 500px; width: 100%;">
            
            <div class="text-center mb-4">
                <h1 class="h3 mb-2">Agende seu Horário</h1>
                <p class="text-muted">Rápido, fácil e direto pelo WhatsApp.</p>
            </div>

            <form id="form-agendamento">
                <div class="mb-3">
                    <label for="nome" class="form-label ms-1">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" placeholder="Como podemos te chamar?" required>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label ms-1">Seu WhatsApp</label>
                    <input type="tel" class="form-control" id="telefone" placeholder="(DD) 99999-9999" required>
                </div>

                <div class="mb-4">
                    <label for="data" class="form-label ms-1">Data e Hora Preferida</label>
                    <input type="datetime-local" class="form-control" id="data" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Confirmar Agendamento</button>
                </div>
            </form>

            <div id="area-sucesso" class="text-center mt-4 d-none">
                <div class="alert alert-success border-0 rounded-4 mb-3">
                    ✅ <strong>Agendamento Recebido!</strong>
                </div>
                
                <p class="small text-muted mb-2">Agora finalize conversando conosco:</p>
                
                <a href="#" id="btn-whatsapp-redirect" target="_blank" class="btn btn-whatsapp w-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-whatsapp" viewBox="0 0 16 16">
                        <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592z"/>
                    </svg>
                    Iniciar Conversa no WhatsApp
                </a>
            </div>

            <div id="mensagem-erro" class="alert alert-danger mt-3 rounded-4 d-none text-center" role="alert"></div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
